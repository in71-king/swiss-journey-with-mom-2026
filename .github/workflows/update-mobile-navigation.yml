name: Update mobile navigation and lightbox controls

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-mobile-navigation.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified site patch
        shell: bash
        run: |
          cat > /tmp/mobile-navigation.patch <<'PATCH'
