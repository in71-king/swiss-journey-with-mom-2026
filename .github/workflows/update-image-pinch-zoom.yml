name: Apply image pinch zoom fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified patch
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > /tmp/image-pinch.patch
          git apply --check /tmp/image-pinch.patch
          git apply /tmp/image-pinch.patch
          node --check app.js
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "app.js index.html styles.css "
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css
          git commit -m "Fix image pinch zoom and navigation controls"
          git push
