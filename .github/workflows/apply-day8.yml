name: Apply day 8 update
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-day8.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify update
        run: |
          curl --fail --location --retry 3             https://swiss-journey-day8-transfer.easymel.chatgpt.site/day8-update.tar.gz             --output /tmp/day8-update.tar.gz
          echo "44586cabd49ffdee8aa3a30000436ceb76418cefecfc27f6a94c2d68b1dcd9d1  /tmp/day8-update.tar.gz" | sha256sum -c -
          tar -xzf /tmp/day8-update.tar.gz -C .
      - name: Commit day 8
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/day8
          git commit -m "Add day 8 Zermatt travel diary"
          git push
