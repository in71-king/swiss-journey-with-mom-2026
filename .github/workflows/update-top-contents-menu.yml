name: Replace bottom navigation with top contents menu

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-top-contents-menu.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified navigation patch
        shell: bash
        run: |
          cat > /tmp/top-contents-menu.patch <<'PATCH'
          diff --git a/app.js b/app.js
          index 24b3b0d..106d7c8 100644
          --- a/app.js
          +++ b/app.js
          @@ -327,13 +327,14 @@ mapRecordYes.addEventListener('click', () => {
           
           const mobileMenuHandle = document.querySelector('.mobile-menu-handle');
           const mobileNavigation = document.querySelector('.mobile-navigation');
          -const mobileNavigationPanel = mobileNavigation.querySelector('.mobile-navigation-panel');
           const mobileNavigationClose = mobileNavigation.querySelector('.mobile-navigation-close');
          +const mobileNavigationTop = mobileNavigation.querySelector('.mobile-navigation-top');
           const mobileNavigationMap = mobileNavigation.querySelector('.mobile-navigation-map');
           const mobileNavigationDays = mobileNavigation.querySelector('.mobile-navigation-days');
           const dayStories = [...document.querySelectorAll('.day-story[id]')];
          -let mobileMenuPointerStartX = null;
          -let mobilePanelTouchStartX = null;
          +let topMenuLastScrollY = window.scrollY;
          +let topMenuScrollFrame = 0;
          +let topMenuRevealPointer = null;
           
           function closeMobileNavigationThen(action) {
             mobileNavigation.addEventListener('close', () => requestAnimationFrame(action), { once: true });
          @@ -379,6 +380,7 @@ function updateMobileNavigationCurrentDay() {
           
           function openMobileNavigation() {
             if (mobileNavigation.open) return;
          +  mobileMenuHandle.classList.remove('is-auto-hidden');
             updateMobileNavigationCurrentDay();
             mobileNavigation.showModal();
             mobileMenuHandle.setAttribute('aria-expanded', 'true');
          @@ -388,24 +390,66 @@ function openMobileNavigation() {
           function finishClosingMobileNavigation() {
             mobileMenuHandle.setAttribute('aria-expanded', 'false');
             document.body.classList.remove('mobile-navigation-open');
          +  mobileMenuHandle.classList.remove('is-auto-hidden');
           }
           
          -mobileMenuHandle.addEventListener('click', openMobileNavigation);
          -mobileMenuHandle.addEventListener('pointerdown', event => {
          -  mobileMenuPointerStartX = event.clientX;
          -  mobileMenuHandle.setPointerCapture?.(event.pointerId);
          -});
          -mobileMenuHandle.addEventListener('pointerup', event => {
          -  if (mobileMenuPointerStartX !== null && event.clientX - mobileMenuPointerStartX < -24) {
          -    openMobileNavigation();
          +function hideTopMenu() {
          +  if (!mobileNavigation.open && window.scrollY > 72) {
          +    mobileMenuHandle.classList.add('is-auto-hidden');
             }
          -  mobileMenuPointerStartX = null;
          -});
          -mobileMenuHandle.addEventListener('pointercancel', () => {
          -  mobileMenuPointerStartX = null;
          -});
          +}
          +
          +function showTopMenu() {
          +  mobileMenuHandle.classList.remove('is-auto-hidden');
          +}
          +
          +window.addEventListener('scroll', () => {
          +  if (topMenuScrollFrame) return;
          +  topMenuScrollFrame = requestAnimationFrame(() => {
          +    const currentScrollY = window.scrollY;
          +    const delta = currentScrollY - topMenuLastScrollY;
          +    if (currentScrollY <= 16 || delta < -7) showTopMenu();
          +    else if (delta > 7) hideTopMenu();
          +    topMenuLastScrollY = currentScrollY;
          +    topMenuScrollFrame = 0;
          +  });
          +}, { passive: true });
          +
          +document.addEventListener('pointerdown', event => {
          +  if (!mobileMenuHandle.classList.contains('is-auto-hidden') || mobileNavigation.open) return;
          +  topMenuRevealPointer = {
          +    id: event.pointerId,
          +    x: event.clientX,
          +    y: event.clientY,
          +    time: performance.now()
          +  };
          +}, { passive: true, capture: true });
          +
          +document.addEventListener('pointerup', event => {
          +  if (!topMenuRevealPointer || event.pointerId !== topMenuRevealPointer.id) return;
          +  const distance = Math.hypot(
          +    event.clientX - topMenuRevealPointer.x,
          +    event.clientY - topMenuRevealPointer.y
          +  );
          +  const elapsed = performance.now() - topMenuRevealPointer.time;
          +  topMenuRevealPointer = null;
          +  if (distance < 12 && elapsed < 550) showTopMenu();
          +}, { passive: true, capture: true });
          +
          +document.addEventListener('pointercancel', () => {
          +  topMenuRevealPointer = null;
          +}, { passive: true, capture: true });
          +
          +mobileMenuHandle.addEventListener('click', openMobileNavigation);
           
           mobileNavigationClose.addEventListener('click', () => mobileNavigation.close());
          +mobileNavigationTop.addEventListener('click', () => {
          +  closeMobileNavigationThen(() => {
          +    history.pushState(null, '', '#top');
          +    window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
          +    showTopMenu();
          +  });
          +});
           mobileNavigationMap.addEventListener('click', () => {
             closeMobileNavigationThen(openMapDialog);
           });
          @@ -417,16 +461,6 @@ mobileNavigation.addEventListener('close', finishClosingMobileNavigation);
           mobileNavigation.addEventListener('click', event => {
             if (event.target === mobileNavigation) mobileNavigation.close();
           });
          -mobileNavigationPanel.addEventListener('touchstart', event => {
          -  mobilePanelTouchStartX = event.touches[0]?.clientX ?? null;
          -}, { passive: true });
          -mobileNavigationPanel.addEventListener('touchend', event => {
          -  const endX = event.changedTouches[0]?.clientX;
          -  if (mobilePanelTouchStartX !== null && endX !== undefined && endX - mobilePanelTouchStartX > 70) {
          -    mobileNavigation.close();
          -  }
          -  mobilePanelTouchStartX = null;
          -}, { passive: true });
           
           mapViewport.addEventListener('wheel', event => {
             event.preventDefault();
          diff --git a/index.html b/index.html
          index a7c2761..7c5f8f3 100644
          --- a/index.html
          +++ b/index.html
          @@ -20,7 +20,7 @@
             </script>
             <link rel="icon" href="./favicon.svg" type="image/svg+xml">
             <link rel="manifest" href="./manifest.webmanifest">
          -  <link rel="stylesheet" href="./styles.css?v=35">
          +  <link rel="stylesheet" href="./styles.css?v=36">
           </head>
           <body>
             <header class="hero" id="top">
          @@ -1521,12 +1521,6 @@
               <a href="#top">처음으로 올라가기</a>
             </footer>
           
          -  <nav class="bottom-nav" aria-label="주요 메뉴">
          -    <a href="#journey-map"><span aria-hidden="true">⌖</span>여행 지도</a>
          -    <a href="#schedule"><span aria-hidden="true">▦</span>날짜별 기록</a>
          -    <a href="#day9"><span aria-hidden="true">♥</span>9일차</a>
          -  </nav>
          -
             <button class="mobile-menu-handle" type="button" aria-controls="mobile-navigation" aria-expanded="false">
               <span aria-hidden="true">☰</span><b>목차</b>
             </button>
          @@ -1540,6 +1534,7 @@
                   </div>
                   <button class="mobile-navigation-close" type="button" aria-label="목차 닫기">×</button>
                 </header>
          +      <button class="mobile-navigation-top" type="button"><span aria-hidden="true">↑</span>처음으로 가기</button>
                 <button class="mobile-navigation-map" type="button"><span aria-hidden="true">⌖</span>여행 지도 크게 보기</button>
                 <h3>날짜별 기록</h3>
                 <nav class="mobile-navigation-days" aria-label="날짜별 여행 기록"></nav>
          @@ -1634,6 +1629,6 @@
               </div>
             </dialog>
           
          -  <script src="./app.js?v=30"></script>
          +  <script src="./app.js?v=31"></script>
           <script>(function(){function c(){var b=a.contentDocument||(a.contentWindow&&a.contentWindow.document);if(b){var d=b.createElement('script');d.innerHTML="window.__CF$cv$params={r:'a3f3d34b0c09f79b',t:'MTc5MDEwNjQ4Nw=='};var a=document.createElement('script');a.src='/cdn-cgi/challenge-platform/scripts/jsd/main.js';document.getElementsByTagName('head')[0].appendChild(a);";b.getElementsByTagName('head')[0].appendChild(d)}}if(document.body){var a=document.createElement('iframe');a.height=1;a.width=1;a.style.position='absolute';a.style.top=0;a.style.left=0;a.style.border='none';a.style.visibility='hidden';document.body.appendChild(a);if('loading'!==document.readyState)c();else if(window.addEventListener)document.addEventListener('DOMContentLoaded',c);else{var e=document.onreadystatechange||function(){};document.onreadystatechange=function(b){e(b);'loading'!==document.readyState&&(document.onreadystatechange=e,c())}}}})();</script></body>
           </html>
          diff --git a/styles.css b/styles.css
          index 384aa0f..663ad38 100644
          --- a/styles.css
          +++ b/styles.css
          @@ -616,3 +616,137 @@ body :where(p, a, span, time, strong, b, button, figcaption, blockquote) {
             html { scroll-behavior: auto; }
             *, *::before, *::after { transition: none !important; }
           }
          +
          +/* 접힘·펼침 화면에서 공통으로 사용하는 상단 목차 바 */
          +.bottom-nav { display: none !important; }
          +footer { padding-bottom: 56px; }
          +body.mobile-navigation-open { overflow: hidden; }
          +
          +.mobile-menu-handle {
          +  position: fixed;
          +  z-index: 19;
          +  left: 50%;
          +  right: auto;
          +  top: 0;
          +  display: flex;
          +  width: min(720px, calc(100% - 24px));
          +  min-height: calc(52px + env(safe-area-inset-top));
          +  align-items: center;
          +  justify-content: center;
          +  gap: 9px;
          +  padding: env(safe-area-inset-top) 18px 0;
          +  border: 1px solid rgba(255,255,255,.32);
          +  border-top: 0;
          +  border-radius: 0 0 17px 17px;
          +  color: white;
          +  background: rgba(8,38,61,.94);
          +  box-shadow: 0 7px 24px rgba(2,13,21,.28);
          +  backdrop-filter: blur(14px);
          +  transform: translateX(-50%);
          +  transition: opacity .2s ease, transform .2s ease;
          +  touch-action: manipulation;
          +  cursor: pointer;
          +}
          +.mobile-menu-handle span { color: #9bd4ea; font-size: 1.2rem !important; line-height: 1; }
          +.mobile-menu-handle b { font-size: 1.05rem !important; writing-mode: horizontal-tb; letter-spacing: .08em; }
          +.mobile-menu-handle.is-auto-hidden,
          +body.mobile-navigation-open .mobile-menu-handle {
          +  opacity: 0;
          +  pointer-events: none;
          +  transform: translate(-50%,calc(-100% - 8px));
          +}
          +
          +.mobile-navigation {
          +  width: 100vw;
          +  height: 100dvh;
          +  max-width: none;
          +  max-height: none;
          +  margin: 0;
          +  padding: 0;
          +  overflow: hidden;
          +  border: 0;
          +  background: transparent;
          +}
          +.mobile-navigation[open] { display: flex; align-items: flex-start; justify-content: center; }
          +.mobile-navigation::backdrop { background: rgba(2,13,21,.62); }
          +.mobile-navigation-panel {
          +  width: min(900px, calc(100% - 24px));
          +  height: auto;
          +  max-height: min(88dvh, 900px);
          +  margin: 0 auto;
          +  padding: max(20px,env(safe-area-inset-top)) 20px 26px;
          +  overflow-x: hidden;
          +  overflow-y: auto;
          +  overscroll-behavior: contain;
          +  border-radius: 0 0 24px 24px;
          +  color: var(--ink);
          +  background: #f6f9fb;
          +  box-shadow: 0 18px 52px rgba(2,13,21,.34);
          +  animation: top-navigation-in .2s ease-out;
          +}
          +.mobile-navigation-panel > header { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
          +.mobile-navigation-panel > header span { color: var(--red); font-size: 1rem !important; font-weight: 900; }
          +.mobile-navigation-panel h2 { margin: 2px 0 0; color: var(--navy-deep); font-size: 2.15rem; line-height: 1.15; }
          +.mobile-navigation-panel h3 { margin: 28px 2px 14px; color: var(--navy-deep); font-size: 1.45rem; }
          +.mobile-navigation-close {
          +  flex: 0 0 auto;
          +  width: 56px;
          +  height: 56px;
          +  padding: 0;
          +  border: 0;
          +  border-radius: 50%;
          +  color: white;
          +  background: var(--navy);
          +  font-size: 2rem !important;
          +  cursor: pointer;
          +}
          +.mobile-navigation-top,
          +.mobile-navigation-map {
          +  display: flex;
          +  width: 100%;
          +  min-height: 68px;
          +  align-items: center;
          +  justify-content: center;
          +  gap: 10px;
          +  margin-top: 10px;
          +  padding: 12px 16px;
          +  border: 2px solid var(--navy);
          +  border-radius: 15px;
          +  font-size: 1.15rem !important;
          +  font-weight: 900;
          +  cursor: pointer;
          +}
          +.mobile-navigation-top { color: white; background: var(--navy); }
          +.mobile-navigation-map { color: var(--navy); background: white; }
          +.mobile-navigation-top span,
          +.mobile-navigation-map span { font-size: 1.4rem !important; }
          +.mobile-navigation-top span { color: #9bd4ea; }
          +.mobile-navigation-map span { color: var(--red); }
          +.mobile-navigation-days { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
          +.mobile-navigation-days a {
          +  display: grid;
          +  grid-template-columns: 82px minmax(0,1fr);
          +  min-height: 82px;
          +  align-items: center;
          +  gap: 12px;
          +  padding: 12px 14px;
          +  border: 2px solid var(--line);
          +  border-radius: 15px;
          +  background: white;
          +  text-decoration: none;
          +}
          +.mobile-navigation-days a span { color: var(--red); font-size: 1.08rem !important; font-weight: 900; }
          +.mobile-navigation-days a strong { color: var(--navy-deep); font-size: 1.12rem !important; line-height: 1.35; }
          +.mobile-navigation-days a.is-current { border-color: var(--red); background: #fff4f1; box-shadow: 0 6px 18px rgba(217,74,61,.14); }
          +.mobile-navigation-days a.is-current span::before { content: '● '; }
          +
          +@media (max-width: 699px) {
          +  .mobile-menu-handle { width: calc(100% - 16px); }
          +  .mobile-navigation-panel { width: 100%; max-height: 90dvh; border-radius: 0 0 20px 20px; }
          +  .mobile-navigation-days { grid-template-columns: 1fr; }
          +}
          +
          +@keyframes top-navigation-in {
          +  from { transform: translateY(-100%); }
          +  to { transform: translateY(0); }
          +}
          
          PATCH
          git apply --check /tmp/top-contents-menu.patch
          git apply /tmp/top-contents-menu.patch
          node --check app.js
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "app.js index.html styles.css "
          test "$(grep -o 'class="bottom-nav"' index.html | wc -l)" -eq 0
          test "$(grep -o 'class="mobile-navigation-top"' index.html | wc -l)" -eq 1
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css
          git commit -m "Use a universal auto-hiding top contents menu"
          git push
